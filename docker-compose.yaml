# ============================================================================
# MANUAL CONFIGURATION (set in Coolify):
#   Domains for admin/public services are configured in Coolify's Domains UI
#   TELEGRAM_BOT_TOKEN — optional
#
# Everything else (passwords, JWT, Supabase keys, admin credentials)
# is auto-generated on first boot by the init service.
# ============================================================================

services:

  # --- Init: generates all secrets on first boot ---
  init:
    build:
      context: .
      dockerfile: docker/init.Dockerfile
    command: ["node", "/scripts/init-secrets.mjs"]
    volumes:
      - config:/config
    networks:
      - agent-net

  # --- Supabase Stack ---
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    depends_on:
      init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command: ["docker-entrypoint.sh", "postgres", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB: agent_os
    volumes:
      - db-data:/var/lib/postgresql/data
      - config:/config:ro
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: docker/gotrue.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command: ["gotrue"]
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_SITE_URL: http://admin
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_DISABLE_SIGNUP: "true"
      API_EXTERNAL_URL: http://admin
    volumes:
      - config:/config:ro
    networks:
      - agent-net

  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    command: ["postgrest", "/config/postgrest.conf"]
    volumes:
      - config:/config:ro
    networks:
      - agent-net

  realtime:
    image: supabase/realtime:v2.30.34
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "set -a && . /config/.env.generated && set +a && exec /app/bin/realtime start"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_NAME: agent_os
      DB_SSL: "false"
      PORT: 4000
      SECURE_COOKIE_FLAG: "false"
      APP_NAME: realtime
      SLOT_NAME: realtime_rls
      ERL_AFLAGS: "-proto_dist inet_tcp"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
    volumes:
      - config:/config:ro
    networks:
      - agent-net

  storage:
    build:
      context: .
      dockerfile: docker/storage.Dockerfile
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/storage-entrypoint.sh"]
    command: ["node", "dist/start/server.js"]
    environment:
      POSTGREST_URL: http://rest:3000
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    volumes:
      - storage-data:/var/lib/storage
      - config:/config:ro
    networks:
      - agent-net

  # --- Application Services ---
  public:
    build:
      context: ./sites/public
      dockerfile: Dockerfile
    expose:
      - "80"
    networks:
      - agent-net

  supervisor:
    build:
      context: .
      dockerfile: apps/supervisor/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command: ["node", "apps/supervisor/dist/index.js"]
    environment:
      POSTGREST_URL: http://rest:3000
      MCP_CONFIG_PATH: /app/mcp-config.json
      AGENT_HOME_DIR: /home/node
      AGENT_RUN_AS_UID: 1000
      AGENT_RUN_AS_GID: 1000
      CONCURRENCY_LIMIT: 5
    volumes:
      - config:/config:ro
      - provider-home:/home/node
      - workspaces:/app/workspaces
    networks:
      - agent-net

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    profiles: ["manual"]
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command: ["node", "apps/mcp/dist/index.js"]
    environment:
      POSTGREST_URL: http://rest:3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - config:/config:ro
    networks:
      - agent-net

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    depends_on:
      init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command: ["node", "/app/server.mjs"]
    ports:
      - "3000:80"
    environment:
      PORT: 80
      POSTGREST_URL: http://rest:3000
      SUPERVISOR_HEALTH_URL: http://supervisor:3001/health
    volumes:
      - config:/config:ro
    networks:
      - agent-net

  browser:
    build:
      context: .
      dockerfile: apps/browser/Dockerfile
    environment:
      CHROMIUM_PATH: /usr/bin/chromium
    networks:
      - agent-net

volumes:
  config:
  db-data:
  provider-home:
  storage-data:
  workspaces:

networks:
  agent-net:
    driver: bridge
