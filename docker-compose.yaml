# ============================================================================
# MANUAL CONFIGURATION (set in the host environment or `.env.vps`):
#   ROOT_DOMAIN / ADMIN_PUBLIC_URL / PUBLIC_SITE_URL
#   TELEGRAM_BOT_TOKEN - optional
#   ADMIN_USER / ADMIN_PASS - optional; if unset, generated on first boot
#
# Everything else (passwords, JWT, Supabase keys, admin credentials)
# is auto-generated on first boot by the init service.
# ============================================================================

services:

  # --- Init: generates all secrets on first boot ---
  init:
    build:
      context: .
      dockerfile: docker/init.Dockerfile
    restart: "no"
    command: ["node", "/scripts/init-secrets.mjs"]
    environment:
      ADMIN_PASS: ${ADMIN_PASS:-}
      ADMIN_USER: ${ADMIN_USER:-}
    volumes:
      - config:/config
    networks:
      - agent-net

  # --- Supabase Stack ---
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command: ["docker-entrypoint.sh", "postgres", "-c", "listen_addresses=*"]
    environment:
      POSTGRES_DB: agent_os
    volumes:
      - db-data:/var/lib/postgresql/data
      - config:/config:ro
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      autoheal: "true"

  auth:
    build:
      context: .
      dockerfile: docker/gotrue.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command: ["gotrue"]
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_SITE_URL: ${ADMIN_PUBLIC_URL:-http://admin}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_DISABLE_SIGNUP: "true"
      API_EXTERNAL_URL: ${ADMIN_PUBLIC_URL:-http://admin}
    volumes:
      - config:/config:ro
    networks:
      - agent-net

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    command: ["postgrest", "/config/postgrest.conf"]
    volumes:
      - config:/config:ro
    networks:
      - agent-net

  realtime:
    image: supabase/realtime:v2.30.34
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "set -a && . /config/.env.generated && set +a && exec /app/bin/realtime start"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_NAME: agent_os
      DB_SSL: "false"
      PORT: 4000
      SECURE_COOKIE_FLAG: "false"
      APP_NAME: realtime
      SLOT_NAME: realtime_rls
      ERL_AFLAGS: "-proto_dist inet_tcp"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
    volumes:
      - config:/config:ro
    networks:
      - agent-net

  storage:
    build:
      context: .
      dockerfile: docker/storage.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    entrypoint: ["/bin/sh", "/scripts/storage-entrypoint.sh"]
    command: ["node", "dist/start/server.js"]
    environment:
      POSTGREST_URL: http://rest:3000
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    volumes:
      - storage-data:/var/lib/storage
      - config:/config:ro
    networks:
      - agent-net

  # --- Application Services ---
  public:
    build:
      context: ./sites/public
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - public-live:/srv/public
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    labels:
      autoheal: "true"

  supervisor:
    build:
      context: .
      dockerfile: apps/supervisor/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command: ["node", "apps/supervisor/dist/index.js"]
    environment:
      CADDY_SITE_SNIPPETS_DIR: ${CADDY_SITE_SNIPPETS_DIR:-}
      POSTGREST_URL: http://rest:3000
      MCP_CONFIG_PATH: /app/mcp-config.json
      AGENT_HOME_DIR: /home/node
      AGENT_RUN_AS_UID: 1000
      AGENT_RUN_AS_GID: 1000
      CONCURRENCY_LIMIT: 5
      PUBLIC_LIVE_DIR: /app/public-live
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - config:/config:ro
      - provider-home:/home/node
      - public-live:/app/public-live
      - workspaces:/app/workspaces
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      autoheal: "true"

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    profiles: ["manual"]
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command: ["node", "apps/mcp/dist/index.js"]
    environment:
      CADDY_SITE_SNIPPETS_DIR: ${CADDY_SITE_SNIPPETS_DIR:-}
      POSTGREST_URL: http://rest:3000
      ROOT_DOMAIN: ${ROOT_DOMAIN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - config:/config:ro
    networks:
      - agent-net

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      rest:
        condition: service_started
      supervisor:
        condition: service_started
    entrypoint: ["/bin/sh", "/scripts/entrypoint.sh"]
    command: ["node", "/app/server.mjs"]
    ports:
      - "127.0.0.1:${ADMIN_LOCAL_PORT:-3000}:80"
    environment:
      ADMIN_PASS: ${ADMIN_PASS:-}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
      ENV_OVERRIDE_KEYS: "ADMIN_USER ADMIN_PASS"
      PORT: 80
      POSTGREST_URL: http://rest:3000
      SUPERVISOR_HEALTH_URL: http://supervisor:3001/health
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - config:/config:ro
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    labels:
      autoheal: "true"

  browser:
    build:
      context: .
      dockerfile: apps/browser/Dockerfile
    restart: unless-stopped
    environment:
      CHROMIUM_PATH: /usr/bin/chromium
    networks:
      - agent-net

volumes:
  config:
  db-data:
  provider-home:
  public-live:
  storage-data:
  workspaces:

networks:
  agent-net:
    driver: bridge
